spring.application.name=pawsy
server.port=8080
logging.level.org.springframework.web.client.RestClient=DEBUG
spring.thymeleaf.cache=false

management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always

user.service.url=${USER_SERVICE_URL}
pet.service.url=${PET_SERVICE_URL}
adoption.service.url=${ADOPTION_SERVICE_URL}

resilience4j.circuitbreaker.instances.petService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.petService.sliding-window-size=5
resilience4j.circuitbreaker.instances.petService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.petService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.sliding-window-size=5
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s